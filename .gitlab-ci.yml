# CI for AgentStateDeveloper-site (Astro static site at repo root)
stages:
  - build
  - publish

build-site:
  stage: build
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Leak-scan-gated publish of main -> GitHub (which then deploys via Pages Action).
# Requires group/project CI vars: GITHUB_REPO, GITHUB_TOKEN, and file-var
# LEAKSCAN_LOCAL (org patterns). Job is skipped until GITHUB_REPO is set.
publish-github:
  stage: publish
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  variables:
    GIT_DEPTH: 0   # leak-scan --range HEAD needs full history
  before_script:
    - apk add --no-cache git bash grep curl
  script:
    - printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - chmod +x scripts/leak-scan.sh scripts/publish-to-github.sh
    - ./scripts/publish-to-github.sh
# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: build
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"

# Explicitly dispatch the GitHub Pages deploy AFTER publish-github mirrors main
# to GitHub. GitHub's native push trigger does not fire reliably for mirror
# pushes, so we invoke workflow_dispatch via the API. `needs: [publish-github]`
# guarantees the mirror lands first — otherwise the Action rebuilds stale content.
# Requires the GH_PAT CI var (a PAT with actions:write on the target repo).
trigger-github-pages:
  stage: publish
  image: curlimages/curl:latest
  needs: ["publish-github"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  script:
    - |
      curl -fsS -X POST \
        -H "Authorization: Bearer $GH_PAT" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/agentstatelabs/agentstatedeveloper-site/actions/workflows/pages.yml/dispatches \
        -d '{"ref":"main"}'
    - echo "Dispatched pages.yml on agentstatelabs/agentstatedeveloper-site"
